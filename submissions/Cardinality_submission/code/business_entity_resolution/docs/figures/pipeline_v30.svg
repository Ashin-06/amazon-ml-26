   <g id="text_2">
    <text style="font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="432" y="89.435313" transform="rotate(-0 432 89.435313)">Supplied Source 1, Source 2 and Source 3 records</text>
   </g>
   <g id="text_3">
    <text style="fill: #33485c; font: 9.5px 'DejaVu Sans'; text-anchor: middle" x="432" y="110.333406" transform="rotate(-0 432 110.333406)">Names, addresses and country; no external entity lookups</text>
   </g>
   <g id="text_4">
    <text style="font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="432" y="172.912344" transform="rotate(-0 432 172.912344)">Normalization and country-specific blocking</text>
   </g>
   <g id="text_5">
    <text style="fill: #33485c; font: 9.5px 'DejaVu Sans'; text-anchor: middle" x="432" y="193.853406" transform="rotate(-0 432 193.853406)">IDF keys, bounded candidates, targeted retrieval and rescue routes</text>
   </g>
   <g id="text_6">
    <text style="font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="196.992" y="262.235312" transform="rotate(-0 196.992 262.235312)">Candidate export</text>
   </g>
   <g id="text_7">
    <text style="fill: #33485c; font: 9.5px 'DejaVu Sans'; text-anchor: middle" x="196.992" y="283.133406" transform="rotate(-0 196.992 283.133406)">All candidate inputs: 181,275,851 pairs</text>
   </g>
   <g id="text_8">
    <text style="font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="628.992" y="262.192344" transform="rotate(-0 628.992 262.192344)">Route-specific matching</text>
   </g>
   <g id="text_9">
    <text style="fill: #33485c; font: 9.5px 'DejaVu Sans'; text-anchor: middle" x="628.992" y="283.133406" transform="rotate(-0 628.992 283.133406)">Tree cascade + neural correction / rescue matcher</text>
   </g>
   <g id="text_10">
    <text style="font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="196.992" y="357.122344" transform="rotate(-0 196.992 357.122344)">candidate_pairs.tsv</text>
   </g>
   <g id="text_11">
    <text style="fill: #33485c; font: 9.5px 'DejaVu Sans'; text-anchor: middle" x="196.992" y="378.173406" transform="rotate(-0 196.992 378.173406)">All retrieval inputs retained</text>
   </g>
   <g id="text_12">
    <text style="font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="628.992" y="357.232344" transform="rotate(-0 628.992 357.232344)">Country-specific decisions</text>
   </g>
   <g id="text_13">
    <text style="fill: #33485c; font: 9.5px 'DejaVu Sans'" transform="translate(539.997781 372.854445)">India/US correction + learned rescue;</text>
    <text style="fill: #33485c; font: 9.5px 'DejaVu Sans'" transform="translate(531.116023 383.492367)">French normalization and structural rules</text>
   </g>
   <g id="text_14">
    <text style="font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="628.992" y="458.032344" transform="rotate(-0 628.992 458.032344)">Ownership and additions-only merge</text>
   </g>
   <g id="text_15">
    <text style="fill: #33485c; font: 9.5px 'DejaVu Sans'" transform="translate(534.741609 473.654445)">At most one Source 1 owner per target;</text>
    <text style="fill: #33485c; font: 9.5px 'DejaVu Sans'" transform="translate(518.047586 484.292367)">French v2 additions preserve existing matches</text>
   </g>
   <g id="text_16">
    <text style="font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="628.992" y="555.842344" transform="rotate(-0 628.992 555.842344)">matching_results.tsv</text>
   </g>
   <g id="text_17">
    <text style="fill: #33485c; font: 9.5px 'DejaVu Sans'; text-anchor: middle" x="628.992" y="576.893406" transform="rotate(-0 628.992 576.893406)">5,807,702 links across 1,732,544 references</text>
   </g>
   <g id="text_18">
    <text style="font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="196.992" y="555.995312" transform="rotate(-0 196.992 555.995312)">Output validation</text>
   </g>
   <g id="text_19">
    <text style="fill: #33485c; font: 9.5px 'DejaVu Sans'" transform="translate(93.643875 571.574445)">Reference coverage, IDs, unique ownership</text>
    <text style="fill: #33485c; font: 9.5px 'DejaVu Sans'" transform="translate(86.855086 582.212367)">and accepted matches ⊆ exported candidates</text>
   </g>
   <g id="text_20">
    <text style="fill: #485c6d; font: 10px 'DejaVu Sans'" transform="translate(229.145312 639.682188)">Logical flow; routing stages grouped for clarity. Dashed arrows: validation inputs.</text>
    <text style="fill: #485c6d; font: 10px 'DejaVu Sans'" transform="translate(273.164062 650.88)">Candidate export is not filtered down to the accepted matches.</text>
   </g>
